name: CodeQL

# Static analysis (SAST) for the Python core. Advanced setup (a committed workflow) is used
# rather than GitHub "default setup" precisely because default setup cannot be SHA-pinned, and
# this repo pins every action to a full commit SHA. Pure Python needs no build step.
# Re-pin the codeql-action SHA when v4 advances (Dependabot bumps the pin + comment).

on:
  push:
    branches: [main]
    # B5 (Nachtrag 1 zu 20260913T2012Z): ein Push, der nur Prosa, Register oder Archivartefakte
    # anfasst, zieht diesen Workflow nicht mehr. Ein .mailmap-Push soll keine sechs Workflows ziehen.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'audit_artifacts/**'
      - 'receipts/**'
      - '.mailmap'
  pull_request:
    branches: [main]
    # B5 (Nachtrag 1 zu 20260913T2012Z): ein Push, der nur Prosa, Register oder Archivartefakte
    # anfasst, zieht diesen Workflow nicht mehr. Ein .mailmap-Push soll keine sechs Workflows ziehen.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'audit_artifacts/**'
      - 'receipts/**'
      - '.mailmap'
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches newly-published queries

# NEBENLAEUFIGKEIT (Nachtrag 1 zu 20260913T2012Z, B1). Gemessen 13.09.2026 20:22Z: fuenf Pushes
# auf EINEN Zweig zwischen 17:55Z und 18:07Z reihten 30 Laeufe ein; 119 warteten, vier CI-Laeufe
# liefen 65 bis 255 Minuten mit 28 Mutations-Shards, waehrend test und coverage darin laengst rot
# waren. Ursache war Saettigung durch eigene Last, kein Ausfall.
#
# cancel-in-progress ist BEDINGT, nicht pauschal: ein spaeterer Push auf denselben Zweig macht das
# Urteil ueber den frueheren Kopf gegenstandslos, ein Nightly oder ein von Hand ausgeloester Lauf
# dagegen soll durchlaufen. Genau das steht im Auftrag (B1) und genau das drueckt der Ausdruck aus.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read            # checkout the repo (a job-level permissions block REPLACES top-level)
      security-events: write   # upload SARIF alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
