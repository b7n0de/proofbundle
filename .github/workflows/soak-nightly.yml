name: soak-nightly

# THE 24h SOAK LEFT THE PULL-REQUEST PATH (owner order 2026-09-17, QITEM-PROOFBUNDLE-AUDIT-MATRIX-
# SOAK-KLEIN-01, steps 2 and 4). A soak is a property of TIME, not of a head; it does not belong
# in a job that judges a pull request. It runs here, on a schedule and by hand, and leaves an
# artefact that names the head it measured. The audit-candidate matrix on a pull request NAMES the
# latest successful run of this workflow (date, head, elapsed); it never ADMITS it -- admission
# still needs the signed, candidate-bound artefact the release ceremony produces.
#
# HONEST LIMIT, measured: a GitHub-hosted job stops at 360 minutes. One run here cannot be the full
# 86400 s soak; the artefact says so (`is_full_soak_24h` is written by the harness from the elapsed
# time, never claimed). The full 24h needs a machine that may run for a day (a self-hosted box) or
# four chained runs -- either is an owner decision, so the default here is what the platform can
# do: 5.5 hours per run, every night.

on:
  schedule:
    - cron: "23 1 * * *"          # nightly, 01:23 UTC
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "wall-clock seconds to soak; clamped to 21000, this job's own budget is 355 minutes"
        required: false
        default: "19800"
      seed:
        description: "seed for the random inputs (default: the run number)"
        required: false
        default: ""

# A scheduled or hand-started run is never cancelled by a newer one, and the event is part of the
# group -- both are contracts in tests/test_der_ci_schnitt_haelt.py.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install with the anchors and pq extras (the operators the soak reaches)
        run: python -m pip install -e ".[dev,pq,anchors,eval]"
      - name: Soak
        # `-u` and no pipe: progress must stay visible (the mutation job learned this on 2026-09-10).
        env:
          DURATION: ${{ github.event.inputs.duration_seconds || '19800' }}
          SEED: ${{ github.event.inputs.seed || github.run_number }}
        run: |
          set -euo pipefail
          # CLAMPED, not trusted: a hand-typed duration above the job's own budget would let the
          # runner kill the soak step itself, and the upload steps below would find no artefact.
          # 21000 s leaves the install and the upload inside the 355-minute budget (lens C, 2026-09-17).
          if [ "${DURATION}" -gt 21000 ] 2>/dev/null; then echo "duration ${DURATION}s clamped to 21000s"; DURATION=21000; fi
          echo "soak ${DURATION}s seed ${SEED} on ${GITHUB_SHA}"
          python -u scripts/fuzz_soak.py --duration-seconds "${DURATION}" --seed "${SEED}" \
            --out "$RUNNER_TEMP/fuzz_soak_nightly.json"
      - name: Bind the artefact to the head it measured
        # The harness writes the version it read from pyproject; the head and the run come from
        # the runner, next to it, so a reader can tell WHICH code was soaked.
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nightly_meta.json"
          p.write_text(json.dumps({
              "schema": "proofbundle.fuzz_soak_nightly_meta.v1",
              "head_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "workflow_sha": os.environ.get("GITHUB_WORKFLOW_SHA"),
          }, indent=2) + "\n", encoding="utf-8")
          print(p.read_text())
          PY
      - name: Upload the soak artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-soak-nightly
          path: |
            ${{ runner.temp }}/fuzz_soak_nightly.json
            ${{ runner.temp }}/nightly_meta.json
          retention-days: 30
