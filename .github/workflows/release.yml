name: Release

# Build the distribution ONCE, attach a signed SLSA build provenance attestation to those exact
# bytes, then publish *those same bytes* to PyPI via Trusted Publishing (OIDC, no token). The
# artifact that lands on PyPI is the artifact that was attested — proven by a sha256 gate before
# upload. This is the same trust-layer idea the library verifies: what you ship must carry a
# verifiable proof of where it came from, and the proof must cover the shipped bytes, not a rebuild.
#
# Supply-chain hardening: all actions are pinned to full commit SHAs (version in a comment), not
# tags — after the tj-actions incident (March 2025) a tag can be silently repointed. Dependabot
# (.github/dependabot.yml) bumps the pin. The `pypi` environment SHOULD have required reviewers
# configured (repo Settings → Environments → pypi) so a `v*` tag cannot publish unreviewed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# KLASSEN-FIX statt Punktreparatur. Ohne diesen Block laeuft jeder `run:`-Schritt unter
# `bash -e {0}` -- also OHNE `pipefail`. Der Rueckgabewert einer Pipeline ist dann der ihres
# LETZTEN Gliedes, und ein Fehler davor verschwindet. Gemessen an genau dieser Datei: fehlte das
# Wheel, lieferte `sha256sum dist/*.whl | cut -d' ' -f1` einen leeren Digest, `sha256sum ./*.whl
# ./*.tar.gz | sed … | tee SHA256SUMS` schrieb eine unvollstaendige Pruefsummendatei -- und der
# Schritt endete mit rc=0, weil `cut` und `tee` gelungen sind. Mit `shell: bash` setzt GitHub
# `bash --noprofile --norc -eo pipefail {0}`, derselbe Fall bricht mit rc=1 ab.
#
# Hier auf Workflow-Ebene und nicht an der einen auffaelligen Stelle, weil die verletzte Annahme
# ("ein fehlgeschlagenes Pipeline-Glied faellt den Schritt") fuer JEDEN Schritt gilt, auch fuer
# jeden, der spaeter dazukommt. Eine Aufzaehlung der heute betroffenen Zeilen waere am naechsten
# hinzugefuegten Schritt schon wieder unvollstaendig.
defaults:
  run:
    shell: bash

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # keyless OIDC (build-provenance attestation)
      attestations: write    # record the provenance attestation
    outputs:
      digest-wheel: ${{ steps.digests.outputs.wheel }}
      digest-sdist: ${{ steps.digests.outputs.sdist }}
      # Die IDENTITAET des Entwurfs, den DIESER Lauf angelegt hat -- nicht sein Tag. Warum die
      # Unterscheidung zaehlt, steht bei `publish-release`.
      release-id: ${{ steps.draft.outputs.id }}
      # `make_latest` war ein Step-Output und damit ausserhalb des Jobs unsichtbar; seit die
      # Veroeffentlichung ein eigener Job ist, muss er ueber die Jobgrenze.
      make-latest: ${{ steps.relmeta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Pre-tag adversarial audit gate (Front-Load F7 — the audit ran for THIS release)
        # The six-lens / master-prompt-v2 adversarial audit is a gate before EVERY tag, not only the
        # audit-candidate (Loek's decoy-parent finding landed AFTER 3.3.0 shipped). This step fails
        # the release if the CHANGELOG section for the tag records no adversarial/N-lens audit and no
        # audit_artifacts file names the version — enforcing the discipline the project already follows.
        run: python scripts/pre_tag_audit_gate.py --repo . --version "${GITHUB_REF_NAME#v}" --strict

      - name: Build sdist and wheel (the ONLY build in this workflow)
        run: |
          python -m pip install --upgrade build
          # F2: ship the byte-reproducible, normalised sdist (SOURCE_DATE_EPOCH + canonical tar),
          # then the wheel alongside it. Same dist/ layout as before; the reproducibility gate
          # (published-artifact-gate.yml) proves two builds are byte-identical.
          # PB-2026-0717-03: export the SAME epoch build_reproducible.py uses (HEAD commit time) so the
          # WHEEL is byte-reproducible too — a bare `python -m build --wheel` embeds the current
          # wall-clock mtime and is NOT reproducible across two clean builds.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/build_reproducible.py --outdir dist
          python -m build --wheel --outdir dist

      - name: Record artifact digests (the attested subjects)
        id: digests
        run: |
          echo "wheel=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # OHNE `dist/`-Praefix, damit `sha256sum -c SHA256SUMS` im Download-Verzeichnis
          # WIRKLICH laeuft. Gemessen: die alte Form schrieb `…  dist/proofbundle-3.8.0-…whl`
          # und meldete beim Pruefen fuer beide Zeilen `No such file or directory / FAILED`.
          #
          # KORRIGIERT 2026-08-16: die erste Fassung dieser Begruendung sagte, RELEASE.md schicke
          # Nutzer "genau mit diesem Kommando" pruefen. Das war FALSCH -- gemessen kam
          # `sha256sum -c` im ganzen Repo genau einmal vor, naemlich in diesem Kommentar selbst;
          # RELEASE.md nannte einen Sichtvergleich (`sha256sum /tmp/pb/*`). Die Aenderung war
          # richtig, ihre Begruendung war eine Falschaussage ueber ein Dokument. Statt sie zu
          # streichen ist sie jetzt WAHR gemacht: RELEASE.md bietet den Pruefbefehl an. Ein
          # Format-Fix ohne ein Kommando, das ihn nutzt, verbessert niemandes Lage.
          ( cd dist && sha256sum ./*.whl ./*.tar.gz | sed 's| \./| |' | tee SHA256SUMS )

      - name: Generate SLSA build provenance for the artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Upload the attested dist for the publish job (exact bytes, no rebuild)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: attested-dist
          path: dist/
          if-no-files-found: error

      - name: Classify the tag (PEP 440 pre-release → GitHub pre-release, not Latest)
        id: relmeta
        run: |
          # vX.Y.ZaN / bN / rcN is a PEP 440 pre-release (beta 2.0.0b2 etc.). Such a release must NOT
          # become the GitHub "Latest" (that would shadow the stable line). 2026-07-05: v2.0.0b2 was
          # wrongly published as Latest because this step did not exist.
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
          fi
      # ALS ENTWURF, und das ist der Kern der Reihenfolge. Ein GitHub-Release feuert den
      # `release`-Webhook, und auf diesem Repo haengt daran Zenodo — gemessen 2026-08-16 ueber
      # `gh api repos/b7n0de/proofbundle/hooks` (events=['release']), belegt am Zenodo-Record
      # 21721509, der exakt den letzten Release-Tag traegt.
      #
      # KORRIGIERT 2026-08-16, die erste Fassung dieser Zeile war falsch. Sie sagte "ein Entwurf
      # feuert ihn NICHT". Das Webhook feuert sehr wohl: GitHub dokumentiert die Aktion `created`
      # woertlich als "A draft was saved, or a release or pre-release was published without
      # previously being saved as a draft", und dieser Hook ist auf das EREIGNIS `release`
      # abonniert, nicht auf eine Aktion. Was NICHT passiert, ist der DOI -- Zenodos Empfaenger
      # handelt auf dem veroeffentlichten Release, nicht auf `created`.
      #
      # Der Unterschied ist nicht akademisch: der Schutz haengt damit an ZENODOS Verhalten, nicht
      # an GitHubs Schweigen. Wuerde Zenodo eines Tages `created` behandeln, waere diese Reihenfolge
      # wirkungslos, ohne dass hier etwas kaputtginge -- und niemand haette es gemerkt. Deshalb
      # steht die Abhaengigkeit ausgeschrieben statt als "feuert nicht" verkuerzt.
      #
      # Vorher lief die Reihenfolge andersherum: Release sofort
      # oeffentlich -> DOI gepraegt -> DANN erst `publish-pypi` in die Freigabe-Warteschlange.
      # Wurde die Freigabe verweigert oder vergessen, existierte ein permanenter, zitierbarer DOI
      # fuer eine Version, die auf PyPI nie erschien. Ein DOI ist nicht zuruecknehmbar.
      #
      # Die irreversible Aussenwirkung passierte damit VOR dem Tor, das sie pruefen soll. Das ist
      # keine Prozess-Meinung, sondern die Reihenfolge in dieser Datei — und sie ist jetzt gedreht.
      - name: Create the GitHub Release as a DRAFT (no DOI yet)
        id: draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          make_latest: ${{ steps.relmeta.outputs.make_latest }}

  publish-pypi:
    # Publishes with PyPI Trusted Publishing (OIDC) — no API token. Requires a one-time human
    # step: configure b7n0de/proofbundle + this workflow as a trusted publisher on pypi.org
    # (Settings → Publishing) BEFORE the first tag. The `pypi` environment SHOULD require
    # reviewer approval.
    #
    # KORRIGIERT 2026-08-16: hier stand "Until then this job fails cleanly and the Release above
    # still succeeds". Das war vor der Umstellung wahr und ist es seitdem NICHT mehr -- mit
    # `publish-release needs: publish-pypi` gibt es ohne diese Freigabe gar kein oeffentliches
    # Release, sondern nur einen dauerhaften Entwurf (den `orphan-draft-notice` meldet). Zwei
    # Kommentare in einer Datei lehrten damit Gegenteiliges, und der veraltete stand im
    # beruhigenden von beiden.
    needs: build-and-attest
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proofbundle/
    permissions:
      id-token: write
    steps:
      - name: Download the ATTESTED dist (no rebuild — published == attested)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: attested-dist
          path: dist/

      - name: Gate — published bytes must equal the attested subjects
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS   # not a distributable; keep only the wheel + sdist for upload
          got_wheel=$(sha256sum dist/*.whl | cut -d' ' -f1)
          got_sdist=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)
          echo "attested wheel:   ${{ needs.build-and-attest.outputs.digest-wheel }}"
          echo "downloaded wheel: $got_wheel"
          test "$got_wheel" = "${{ needs.build-and-attest.outputs.digest-wheel }}"
          test "$got_sdist" = "${{ needs.build-and-attest.outputs.digest-sdist }}"
          echo "OK: publishing the exact bytes that were attested."

      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # PyPI recomputes and records PEP 740 attestations for these uploaded files; because
          # they are the attested artifacts (gate above), the PyPI attestation and the SLSA
          # provenance describe the same bytes. skip-existing keeps a re-tag idempotent.
          packages-dir: dist/
          skip-existing: true

  orphan-draft-notice:
    # WAS SONST STILL PASSIERT WAERE. Faellt `publish-pypi` -- Trusted Publishing noch nicht
    # eingerichtet, Netzfehler, Digest-Tor, oder die Umgebungs-Freigabe laeuft nach 30 Tagen aus --
    # dann wird `publish-release` per Default uebersprungen und der fertige Entwurf mit allen
    # Assets bleibt unbegrenzt liegen, fuer die Oeffentlichkeit unsichtbar und ohne jedes Signal.
    # Das ist der richtige Endzustand (kein DOI fuer etwas, das nicht auf PyPI liegt), aber er darf
    # nicht LAUTLOS sein: ein Entwurf, von dem niemand weiss, sieht aus wie ein vergessenes Release.
    needs: [build-and-attest, publish-pypi]
    if: always() && needs.build-and-attest.result == 'success' && needs.publish-pypi.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Sag klar, dass ein Entwurf liegenbleibt
        env:
          TAG: ${{ github.ref_name }}
          REL_ID: ${{ needs.build-and-attest.outputs.release-id }}
          PYPI: ${{ needs.publish-pypi.result }}
        run: |
          echo "::warning title=Entwurf bleibt liegen::publish-pypi=$PYPI — der Release-Entwurf $TAG (id ${REL_ID:-unbekannt}) wurde NICHT veroeffentlicht. Kein DOI, kein oeffentliches Release. Entweder die PyPI-Freigabe nachholen und den Lauf wiederholen, oder den Entwurf verwerfen: gh release delete $TAG --repo $GITHUB_REPOSITORY --yes"

  publish-release:
    # DER SCHRITT, DER DEN DOI PRAEGT — und er laeuft jetzt ZULETZT.
    #
    # `needs: publish-pypi` ist die ganze Aenderung: der Entwurf wird erst oeffentlich, wenn die
    # Bytes wirklich auf PyPI liegen. Damit faellt der Zenodo-Webhook hinter das Owner-Tor
    # (environment: pypi, required reviewer) statt davor.
    #
    # WAS PASSIERT, WENN DIE FREIGABE AUSBLEIBT: `publish-pypi` wartet, dieser Job laeuft nie, der
    # Entwurf bleibt ein Entwurf. Kein DOI, kein oeffentliches Release, kein "Latest", das auf eine
    # Version zeigt, die es auf PyPI nicht gibt. Tag und Attestierung bleiben — die sind
    # zurueckziehbar, ein DOI nicht. Genau deshalb steht die Grenze hier und nicht frueher.
    #
    # EHRLICHE GRENZE: das schuetzt gegen die REIHENFOLGE, nicht gegen ein Versehen beim Freigeben.
    # Wer die PyPI-Freigabe erteilt, veroeffentlicht damit auch das Release und den DOI. Das ist
    # gewollt — es ist EINE Entscheidung an EINER Stelle statt zwei an verschiedenen.
    needs: [build-and-attest, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release (this is what mints the DOI)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REL_ID: ${{ needs.build-and-attest.outputs.release-id }}
          MAKE_LATEST: ${{ needs.build-and-attest.outputs.make-latest }}
        run: |
          set -euo pipefail
          # AUFGELOEST WIRD UEBER DIE ID, NICHT UEBER DEN TAG. Die erste Fassung fuhr
          # `gh release view "$TAG"`. Dessen Aufloesung (cli/cli, release/shared/fetch.go) startet
          # zwei Suchen parallel -- veroeffentlichte per REST, Entwuerfe per GraphQL -- und nimmt,
          # WER ZUERST FEHLERFREI ANTWORTET. Existieren zu einem Tag ein veroeffentlichtes UND ein
          # Entwurfs-Release, ist nicht bestimmt, welches gemeldet wird. Das ist auf diesem Repo
          # kein Gedankenspiel: die verwendete Action traegt eigens Code gegen Doppel-Entwuerfe
          # (`cleanupCreatedDuplicateDraftRelease`), und in den Zenodo-Daten stehen zwei Records
          # auf `corpus-review-2026-07-25-iter10` und zwei auf `v2.0.0`. Traefe dieser Schritt in
          # so einem Zustand den ZWEITEN Entwurf, veroeffentlichte er ein zweites Release-Objekt
          # zum selben Tag -- also einen zweiten, permanenten DOI. Genau das, was die neue
          # Reihenfolge verhindern soll. Die ID ist die eines Objekts; ein Tag ist es nicht.
          if [ -z "${REL_ID:-}" ]; then
            echo "::error::build-and-attest hat keine Release-ID geliefert — es wird NICHTS veroeffentlicht."
            exit 1
          fi

          # DREI ZUSTAENDE, nicht zwei. `true` -> veroeffentlichen. `false` -> dieser Tag ist
          # bereits oeffentlich, das ist ein Wiederholungslauf und ein ERFOLG, kein Fehler: die
          # erste Fassung brach hier mit `grep -qx true` rot ab, obwohl der Endzustand stimmte.
          # Ein Riegel, der bei korrektem Ergebnis rot meldet, wird beim naechsten Mal entfernt --
          # und dann ist das Tor weg. Alles andere (leer, `null`, Netzfehler) -> BLOCK, denn ein
          # unlesbarer Zustand ist keine Freigabe.
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID" --jq '.draft')"
          case "$state" in
            true)  ;;
            false) echo "Release $REL_ID ist bereits oeffentlich — nichts zu tun."; exit 0 ;;
            *)     echo "::error::Entwurfs-Zustand nicht lesbar ('$state') — es wird NICHTS veroeffentlicht."; exit 1 ;;
          esac

          # `make_latest` wird HIER gesetzt und nicht beim Anlegen: die REST-Doku sagt woertlich
          # "Drafts and prereleases cannot be set as latest", und der Zweig der Action, der es beim
          # Veroeffentlichen nachgezogen haette, wird bei `draft: true` uebersprungen. Seit der
          # Umstellung war die 2026-07-05 erkaempfte Absicht (v2.0.0b2 wurde faelschlich "Latest")
          # damit tote Konfiguration. Der PATCH belebt sie.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" \
            -F draft=false -f make_latest="${MAKE_LATEST:-true}" >/dev/null
          echo "Release $TAG (id $REL_ID) veroeffentlicht — nach dem PyPI-Upload, nicht davor."
