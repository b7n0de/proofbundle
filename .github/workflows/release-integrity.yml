name: release-integrity

# Release-integrity gate: version single-sourcing (pyproject == __init__ == CITATION.cff), CHANGELOG
# documents the current version, and no undelivered post-tag drift (non-trivial commits since the last
# tag without a version bump or an [Unreleased] section). Closes the "merged but never released" class
# that let the M2 security fix and the 811-vs-817 changelog typo sit unreleased on main.
# Actions are pinned to full commit SHAs (Scorecard/supply-chain hardening), matching ci.yml.

on:
  push:
    branches: [main]
    # Only frozen archives are skipped (owner decision, 2026-09-23). This workflow is the only
    # runner of the version gate, and three of its checks read Markdown: CHANGELOG.md, the declared
    # places RELEASE.md, docs/readiness_pack/PROGRESS.md and README.md, and a sweep over every
    # tracked file. With Markdown and docs/ ignored, a change that left a stale release claim in
    # prose never ran the check that exists to catch it.
    paths-ignore:
      - 'audit_artifacts/**'
      - 'receipts/**'
  pull_request:
    branches: [main]
    # Only frozen archives are skipped (owner decision, 2026-09-23). This workflow is the only
    # runner of the version gate, and three of its checks read Markdown: CHANGELOG.md, the declared
    # places RELEASE.md, docs/readiness_pack/PROGRESS.md and README.md, and a sweep over every
    # tracked file. With Markdown and docs/ ignored, a change that left a stale release claim in
    # prose never ran the check that exists to catch it.
    paths-ignore:
      - 'audit_artifacts/**'
      - 'receipts/**'

# NEBENLAEUFIGKEIT (Nachtrag 1 zu 20260913T2012Z, B1). Gemessen 13.09.2026 20:22Z: fuenf Pushes
# auf EINEN Zweig zwischen 17:55Z und 18:07Z reihten 30 Laeufe ein; 119 warteten, vier CI-Laeufe
# liefen 65 bis 255 Minuten mit 28 Mutations-Shards, waehrend test und coverage darin laengst rot
# waren. Ursache war Saettigung durch eigene Last, kein Ausfall.
#
# cancel-in-progress ist BEDINGT, nicht pauschal: ein spaeterer Push auf denselben Zweig macht das
# Urteil ueber den frueheren Kopf gegenstandslos, ein Nightly oder ein von Hand ausgeloester Lauf
# dagegen soll durchlaufen. Genau das steht im Auftrag (B1) und genau das drueckt der Ausdruck aus.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  version-and-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history for the post-tag-drift check
      - name: Fetch tags
        run: git fetch --tags --force
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Version and changelog integrity
        run: python3 scripts/check_version_and_changelog.py --repo .
