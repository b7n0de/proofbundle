name: Scorecard

# OpenSSF Scorecard — supply-chain posture (pinned deps, token permissions, branch protection,
# dangerous workflows, SAST, fuzzing, signed releases). Publishes results so the badge works.
# Measured 2026-08-07 (v5.5.0, overall 6.5/10), not assumed: Token-Permissions, SAST and Fuzzing do
# score 10/10. Pinned-Dependencies does NOT — it scores 3/10, while an earlier version of this
# comment claimed the check was maxed because all actions are SHA-pinned. Actions are only one input;
# the check also weighs pip/Dockerfile pinning. A comment that states a score nobody re-measured is
# the same defect class this project reports about version numbers, so it now carries its date.
# Current state per check: docs/openssf_best_practices_self_assessment.md.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
    # B5 (Nachtrag 1 zu 20260913T2012Z): ein Push, der nur Prosa, Register oder Archivartefakte
    # anfasst, zieht diesen Workflow nicht mehr. Ein .mailmap-Push soll keine sechs Workflows ziehen.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'audit_artifacts/**'
      - 'receipts/**'
      - '.mailmap'

# NEBENLAEUFIGKEIT (Nachtrag 1 zu 20260913T2012Z, B1). Gemessen 13.09.2026 20:22Z: fuenf Pushes
# auf EINEN Zweig zwischen 17:55Z und 18:07Z reihten 30 Laeufe ein; 119 warteten, vier CI-Laeufe
# liefen 65 bis 255 Minuten mit 28 Mutations-Shards, waehrend test und coverage darin laengst rot
# waren. Ursache war Saettigung durch eigene Last, kein Ausfall.
#
# cancel-in-progress ist BEDINGT, nicht pauschal: ein spaeterer Push auf denselben Zweig macht das
# Urteil ueber den frueheren Kopf gegenstandslos, ein Nightly oder ein von Hand ausgeloester Lauf
# dagegen soll durchlaufen. Genau das steht im Auftrag (B1) und genau das drueckt der Ausdruck aus.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # required by publish_results from scorecard-action v2+
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
