[package]
name = "z381_pruefentscheidung"
version = "0.1.0"
edition = "2021"
description = "Z381: proof harness for the decision function of pb_verify_rs verify-bundle. Builds the REAL verifier source with a substituted process boundary; never ships."
license = "Apache-2.0"
publish = false
build = "build.rs"

# Stand-alone: not a member of any workspace.
[workspace]

# The SAME dependency lines as tools/pb_verify_rs/Cargo.toml; Cargo.lock pins the SAME versions
# (checked by tests/lock_parity.rs).
[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.2"
base64 = "0.22"
hex = "0.4"

[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 2
debug-assertions = true
overflow-checks = true
